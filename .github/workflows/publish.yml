name: Publish to PyPI

# 触发条件：推送 v* 格式的 tag 时自动发布
on:
  push:
    tags:
      - "v*"

jobs:
  # ── 第 1 步：构建 ──
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  # ── 第 2 步：发布到 PyPI ──
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # 关键：配置 OIDC 权限，Trusted Publisher 需要
    permissions:
      id-token: write
    # 关键：指定 PyPI 环境（可在 GitHub 仓库设置中添加保护规则）
    environment:
      name: pypi
      url: https://pypi.org/project/visqol-python/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # 不需要任何 token 配置！Trusted Publisher 自动处理认证

  # ── 第 3 步（可选）：创建 GitHub Release ──
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
