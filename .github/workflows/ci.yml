name: CI

on:
  push:
    branches: [main, 'perf/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NUMBA_NUM_THREADS: "4"
  NUMBA_THREADING_LAYER: "workqueue"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check visqol/ tests/

      - name: Ruff format check
        run: ruff format --check visqol/ tests/

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy visqol/ --ignore-missing-imports

  test:
    name: Test (py${{ matrix.python-version }} / np${{ matrix.numpy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        numpy-version: ["1.x", "2.x"]
        exclude:
          - python-version: "3.13"
            numpy-version: "1.x"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Pin NumPy version
        run: |
          if [ "${{ matrix.numpy-version }}" = "1.x" ]; then
            pip install "numpy>=1.20,<2"
          else
            pip install "numpy>=2.0"
          fi

      - name: Show dependency versions
        run: python -c "import numpy; import scipy; print(f'numpy={numpy.__version__}  scipy={scipy.__version__}')"

      - name: Run tests
        run: python -m pytest tests/test_quick.py tests/test_parallel_correctness.py -v

  accelerated:
    name: Accelerated (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional backends and tests
        run: python -m pip install -e ".[test,accel,fftw,lattice]"
      - name: Fetch verified official conformance data
        run: python tests/fetch_conformance_data.py
      - name: Test all outputs against legacy kernels
        run: |
          python -m pytest tests -q --testdata .testdata --fft-backend fftw --junitxml=test-results/fftw.xml
          python -m pytest tests -q --testdata .testdata --fft-backend scipy --junitxml=test-results/scipy.xml
      - name: Measure warm performance (no platform-independent speed threshold)
        run: python tests/bench_portable.py --json test-results/benchmark.json
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: accelerated-${{ matrix.os }}
          path: test-results/

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*
