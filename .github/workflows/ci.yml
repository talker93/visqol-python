name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check visqol/ tests/

      - name: Ruff format check
        run: ruff format --check visqol/ tests/

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy visqol/ --ignore-missing-imports

  test:
    name: Test (py${{ matrix.python-version }} / np${{ matrix.numpy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
        numpy-version: ["1.x", "2.x"]
        exclude:
          # NumPy 2.x requires Python >= 3.10
          - python-version: "3.9"
            numpy-version: "2.x"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Pin NumPy version
        run: |
          if [ "${{ matrix.numpy-version }}" = "1.x" ]; then
            pip install "numpy>=1.20,<2"
          else
            pip install "numpy>=2.0"
          fi

      - name: Show dependency versions
        run: python -c "import numpy; import scipy; print(f'numpy={numpy.__version__}  scipy={scipy.__version__}')"

      - name: Run tests
        run: pytest tests/test_quick.py -v

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*
